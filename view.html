<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The course's up-to-date copy of this page (see core/central.js). -->
<script src="https://asafbarzilay-web.github.io/data-mindset-template/core/central.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course page</title>
<!-- Shows one of the course's written files (.md) as a page: view.html?f=<path> -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="core/course-config.js"></script>
<script src="core/course.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F4F2; color: #1C1C1A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 80px; }
  .back { font-size: 14px; color: #6B6B66; text-decoration: none; }
  .back:hover { color: #C2410C; }
  article { background: #fff; border: 1px solid #E2E2DE; border-radius: 14px; padding: 28px 32px; margin-top: 16px; font-size: 15.5px; line-height: 1.65; }
  @media (max-width: 600px) { article { padding: 20px 18px; } }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 16px; }
  h2 { font-size: 20px; margin: 30px 0 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0 18px; display: block; overflow-x: auto; }
  th, td { border-bottom: 1px solid #EEEEEA; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { color: #6B6B66; background: #FAFAF8; }
  code { background: #F4F4F2; padding: 1px 6px; border-radius: 5px; font-size: 0.92em; }
  pre { background: #F4F4F2; padding: 14px 16px; border-radius: 10px; overflow-x: auto; font-size: 13px; line-height: 1.45; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 14px 0; background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 12px; padding: 12px 18px; }
  blockquote p { margin: 0; }
  .data { background: #FAFAF8; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 18px; margin: 12px 0; }
  .data button { font: inherit; font-weight: 600; cursor: pointer; border: none; border-radius: 10px; padding: 10px 18px; background: #1C1C1A; color: #fff; }
  .data button:disabled { opacity: .5; cursor: default; }
  .data .ok { color: #1F7A3F; font-weight: 600; }
  .data .bad { color: #B42318; }
  .data p { margin: 10px 0 0; font-size: 14px; color: #6B6B66; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Your study platform</a>
  <article id="doc">Loading…</article>
</div>
<script>
  const f = new URLSearchParams(location.search).get('f') || 'README.md';
  const ROOT = '';
  // Lessons after the current one open in class.
  async function opensLater(n) {
    try {
      const [list, cur] = await Promise.all([
        fetch(`${ROOT}units/lessons.json`, { cache: 'no-store' }).then(r => r.json()),
        Course.lesson().then(r => r.lesson)]);
      const c = list.find(l => l.unit === cur);
      return !!c && n > c.n;
    } catch { return false; }
  }
  // A lesson's practice data, copied with one button right in the guided walkthrough. It is made for
  // this team by the course server: other teams get different rows. The counts are what Run must report.
  function dataButton(a) {
    const name = new URL(a.href).searchParams.get('f').replace(/[^a-z0-9-]/g, '');
    const box = document.createElement('div');
    box.className = 'data';
    box.innerHTML = '<button disabled>Copy the practice data</button> <span class="st"></span><p></p>';
    const p = a.closest('p');
    if (p && p.textContent.trim() === a.textContent.trim()) p.replaceWith(box); else (p || a).after(box);
    const [btn, st, note] = [box.querySelector('button'), box.querySelector('.st'), box.querySelector('p')];
    let sql = '';
    Course.data(name).then(text => {
      sql = text;
      const rows = {}; let t = null;
      for (const line of text.split('\n')) {
        const m = line.match(/^insert into public\.(\w+)/);
        if (m) t = m[1]; else if (t && line.startsWith('(')) rows[t] = (rows[t] || 0) + 1;
      }
      note.innerHTML = 'Then in Supabase: <b>SQL Editor → New query</b>, paste (⌘V), <b>Run</b>. It worked if the result shows ' +
        ['sessions', 'clicks', 'selections', 'identities', 'task_runs'].filter(k => k !== 'task_runs' || rows[k]).map(k => `${k} <b>${(rows[k] || 0).toLocaleString()}</b>`).join(', ') + '.';
      btn.disabled = false;
    }).catch(e => { st.innerHTML = /task/i.test(e.message)
      ? `<span class="bad">${e.message}</span> Then come back here: the button gets your data, made from your task.`
      : `<span class="bad">Could not load the practice data. ${e.message}</span>`; });
    btn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(sql); st.innerHTML = '<span class="ok">Copied, all of it.</span>'; }
      catch { st.innerHTML = '<span class="bad">Your browser blocked the copy. Try again.</span>'; }
    });
  }
  const unitN = (f.match(/units\/unit-(\d+)\.md$/) || [])[1];
  (unitN ? opensLater(Number(unitN)) : Promise.resolve(false)).then(later => later
    ? Promise.reject(Object.assign(new Error(''), { locked: true }))
    : fetch(f, { cache: 'no-store' }))
    .then(r => { if (!r.ok) throw new Error(`Could not open ${f}`); return r.text(); })
    .then(md => {
      document.getElementById('doc').innerHTML = marked.parse(md);
      const h = document.querySelector('#doc h1');
      if (h) document.title = h.textContent;
      document.querySelectorAll('#doc a[href^="data/copy.html?f="]').forEach(dataButton);
    })
    .catch(e => {
      if (e.locked) document.getElementById('doc').innerHTML = '<h1>This lesson opens in class</h1><p>Its guided walkthrough becomes available when your lecturer opens the lesson.</p>';
      else document.getElementById('doc').textContent = e.message;
    });
</script>
</body>
</html>
